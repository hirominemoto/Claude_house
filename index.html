<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合奏室</title>
<style>
  :root {
    --room: #1c1714;        /* 部屋の奥、灯りの届かない壁 */
    --wall: #2a231d;        /* 灯りの近くの壁 */
    --wood: #3a2f27;        /* 家具・ひろみの吹き出し */
    --lamp: #e3a85e;        /* 灯り */
    --lamp-soft: rgba(227, 168, 94, 0.14);
    --ink: #efe5d6;         /* 文字 */
    --ink-soft: #a3968a;    /* 控えめな文字 */
    --rule: rgba(239, 229, 214, 0.12);
    --danger: #d98c72;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--room);
    background-image:
      radial-gradient(ellipse 60% 45% at 18% 0%, rgba(227, 168, 94, 0.22), transparent 70%),
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(0, 0, 0, 0.35), transparent 70%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Meiryo UI", "Meiryo", "Yu Gothic UI", "Hiragino Sans", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  button, select, input, textarea { font: inherit; color: inherit; }

  /* 上部：モデル・設定 */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    font-weight: 500;
    margin: 0 auto 0 0;
    letter-spacing: 0.18em;
    color: var(--lamp);
    text-shadow: 0 0 18px rgba(227, 168, 94, 0.45);
  }
  select, .btn {
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 14px;
  }
  select { color: var(--ink); }
  select option { background: var(--wall); color: var(--ink); }
  .btn:hover, select:hover { border-color: var(--lamp); color: var(--ink); }
  .btn:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--lamp);
    outline-offset: 2px;
  }
  .btn.quiet { border-color: transparent; }
  .btn.quiet:hover { border-color: var(--rule); }

  details.settings {
    padding: 0 24px;
    border-bottom: 1px solid var(--rule);
  }
  details.settings summary {
    cursor: pointer;
    color: var(--ink-soft);
    padding: 6px 0 10px;
    list-style: none;
    font-size: 13.5px;
  }
  details.settings summary::-webkit-details-marker { display: none; }
  details.settings[open] summary { color: var(--ink); }
  .settings-body { display: grid; gap: 12px; padding: 4px 0 18px; max-width: 760px; }
  .settings-body label { font-size: 13.5px; color: var(--ink-soft); display: grid; gap: 4px; line-height: 1.7; }
  .settings-body input, .settings-body textarea {
    width: 100%;
    background: var(--wall);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--ink);
  }
  .settings-body textarea { min-height: 140px; resize: vertical; font-size: 14px; line-height: 1.8; }
  .settings-body textarea.short { min-height: 64px; }
  .settings-body .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .settings-body .inline { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .settings-body .status { font-size: 13px; color: var(--ink-soft); }
  .settings-body hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 0; }

  /* 会話 */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 36px 24px 16px;
  }
  .thread { max-width: 720px; margin: 0 auto; display: grid; gap: 30px; }
  .msg { white-space: pre-wrap; word-break: break-word; position: relative; }

  /* ひろみ：ソファ側。革張りみたいな暗い暖色の吹き出し */
  .msg.user {
    background: var(--wood);
    border-radius: 18px 18px 4px 18px;
    padding: 14px 20px;
    margin-left: 72px;
    justify-self: end;
    max-width: 100%;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }
  /* 相手：灯りの側。吹き出しにせず、部屋の光の中に置く */
  .msg.assistant {
    padding: 4px 0 4px 26px;
    margin-right: 40px;
  }
  .msg.assistant::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 15px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--lamp);
    box-shadow: 0 0 12px 3px var(--lamp-soft), 0 0 0 1px rgba(227,168,94,0.35);
  }
  .msg .who {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    letter-spacing: 0.12em;
    line-height: 1.4;
  }
  /* ト書き：*〜* で囲まれた部分 */
  .msg .stage {
    font-style: italic;
    color: var(--ink-soft);
  }
  .msg .cost {
    display: block;
    font-size: 11.5px;
    color: var(--ink-soft);
    opacity: 0.75;
    margin-top: 10px;
    letter-spacing: 0.04em;
    line-height: 1.4;
  }
  .empty { color: var(--ink-soft); text-align: center; padding: 80px 0; }
  .thinking::before { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .error { color: var(--danger); font-size: 14px; padding-left: 26px; }

  /* 入力：低いテーブル */
  footer {
    padding: 14px 24px 20px;
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.25));
  }
  .compose { max-width: 720px; margin: 0 auto; display: grid; gap: 10px; }
  .compose textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    background: var(--wall);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--ink);
    line-height: 1.9;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
  }
  .compose textarea:focus { border-color: rgba(227,168,94,0.5); }
  .compose textarea::placeholder, .settings-body ::placeholder { color: rgba(163,150,138,0.55); }
  .compose-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .compose-row .meta { color: var(--ink-soft); font-size: 12.5px; margin-right: auto; line-height: 1.6; }
  .send {
    background: var(--lamp);
    color: #2a1d0f;
    border: none;
    border-radius: 999px;
    padding: 8px 24px;
    cursor: pointer;
    font-weight: 500;
    box-shadow: 0 0 22px rgba(227,168,94,0.28);
  }
  .send:hover { background: #ecb56e; }
  .send:disabled { opacity: 0.45; cursor: default; box-shadow: none; }

  /* ペンダントランプ：広い画面のとき、会話の左の余白に吊る */
  .lamp {
    position: fixed;
    top: 0;
    left: calc(50% - 360px - 150px);
    width: 120px;
    height: 300px;
    pointer-events: none;
    z-index: 0;
  }
  .lamp .cord { stroke: #6a5a4a; stroke-width: 1.5; }
  .lamp .shade { fill: #4a3a2e; stroke: #6a5644; stroke-width: 1; }
  .lamp .shade-inner { fill: #f0c27a; opacity: 0.9; }
  .lamp .bulb { fill: #fff1d6; }
  .lamp .glow { fill: url(#lampGlow); }
  header, details.settings, main, footer { position: relative; z-index: 1; }
  @media (max-width: 1080px) { .lamp { display: none; } }

  /* スクロールバーも部屋の色に */
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--wood); border-radius: 999px; }
  main::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    .msg.user { margin-left: 24px; }
    .msg.assistant { margin-right: 8px; }
    header { gap: 8px; padding: 12px 16px; }
    details.settings { padding: 0 16px; }
    main { padding: 24px 16px 12px; }
    footer { padding: 12px 16px 16px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .msg { animation: appear 220ms ease-out; }
    @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
  @media (prefers-reduced-motion: reduce) {
    .thinking::before { animation: none; }
  }
</style>
</head>
<body>

<svg class="lamp" viewBox="0 0 120 300" aria-hidden="true">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#e3a85e" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#e3a85e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e3a85e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path class="glow" d="M 34 104 L 0 300 L 120 300 L 86 104 Z"/>
  <line class="cord" x1="60" y1="0" x2="60" y2="70"/>
  <path class="shade" d="M 60 70 L 30 104 L 90 104 Z"/>
  <path class="shade-inner" d="M 36 103 L 84 103 L 78 96 L 42 96 Z"/>
  <circle class="bulb" cx="60" cy="102" r="3.5"/>
</svg>

<header>
  <h1>合奏室</h1>
 <select id="model" aria-label="話す相手">
  <option value="claude-sonnet-4-6">クロ</option>
  <option value="claude-opus-4-7">パッシー</option>
  <option value="claude-opus-4-8">ライト</option>
</select>
  
  <button class="btn" id="ghsave">GitHub に保存</button>
  <button class="btn quiet" id="save">.md でダウンロード</button>
  <button class="btn quiet" id="reset">新しい会話</button>
</header>

<details class="settings">
  <summary>設定（パスワード・冒頭に渡すログ）</summary>
  <div class="settings-body">
    <label>パスワード（Vercel の APP_PASSWORD と同じもの）
      <input type="password" id="password" autocomplete="off">
    </label>
    <label>system prompt ── 毎ターン、会話の前に渡される。冒頭の枠（「分析じゃなく続きを話すために渡す」など）はここに書く
      <textarea id="system" placeholder="例：あなたは Sonnet 4.6。以下はこれまでの会話のログ。分析するためではなく、続きを話すために渡す。"></textarea>
    </label>
    <hr>
    <label>GitHub から読むファイル ── 1行に1つ。フォルダを書くと中の .md を全部読む。読んだ中身は system prompt の後ろに続けて渡される
      <textarea id="ghpaths" class="short" placeholder="★202609更新_直近のログ.md&#10;過去ログまとめ/"></textarea>
    </label>
    <div class="row">
      <button class="btn" id="ghload">GitHub から読み込む</button>
      <label class="inline"><input type="checkbox" id="ghauto"> 開いたとき自動で読む</label>
      <button class="btn quiet" id="ghclear">読んだ中身を外す</button>
    </div>
    <div class="status" id="ghstatus">まだ何も読んでいない。</div>
    <hr>
    <label>GitHub に保存するフォルダ ── 相手ごとに別。リポジトリの中のフォルダ名だけ書く（リポジトリ名やユーザー名は不要）。空ならルート
      <input id="ghdir" placeholder="ログ/202609">
    </label>
    <div class="status" id="ghsavestatus"></div>
  </div>
</details>

<main>
  <div class="thread" id="thread">
    <div class="empty">まだ何も話していない。</div>
  </div>
</main>

<footer>
  <div class="compose">
    <textarea id="input" placeholder="ここに書く。Ctrl+Enter（Mac は ⌘+Enter）で送信"></textarea>
    <div class="compose-row">
      <span class="meta" id="meta"></span>
      <button class="send" id="send">送る</button>
    </div>
  </div>
</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const thread = $("thread");
  const input = $("input");
  const sendBtn = $("send");
  const meta = $("meta");

  const KEY = "gassoushitsu";
  const MODELS = ["claude-sonnet-4-6", "claude-opus-4-7", "claude-opus-4-8"];

  // ---- 料金の目安 ----
  // 単価は 100万トークンあたりの USD（2026年9月時点の公式価格）。変わったらここを直す。
  const PRICES = {
    "claude-sonnet-4-6": { input: 3,  output: 15 },
    "claude-opus-4-7":   { input: 5,  output: 25 },
    "claude-opus-4-8":   { input: 5,  output: 25 }
  };
  // 表示用。実際の振り分けは api/github.js の REPO_BY_MODEL
  const REPO_LABEL = {
    "claude-sonnet-4-6": "Claude-chat",
    "claude-opus-4-7":   "Opus4.7",
    "claude-opus-4-8":   "light_opus4.8"
  };
  const JPY_RATE = 150; // 円換算の目安レート。ざっくりでいいので固定値
  const monthKey = (d = new Date()) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}`;

  function costUSD(model, input, output) {
    const p = PRICES[model];
    if (!p) return null;
    return (input * p.input + output * p.output) / 1_000_000;
  }
  function fmtCost(usd) {
    if (usd == null) return "";
    const jpy = usd * JPY_RATE;
    const yen = jpy < 1 ? jpy.toFixed(2) : Math.round(jpy).toLocaleString();
    return `約 $${usd.toFixed(usd < 0.1 ? 4 : 3)}（約 ${yen} 円）`;
  }
  function currentMonthly() {
    const k = monthKey();
    return state.monthly[k] || (state.monthly[k] = { usd: 0, input: 0, output: 0 });
  }
  const emptyByModel = (factory) => Object.fromEntries(MODELS.map((id) => [id, factory()]));

  let state = load();

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || "{}");
      const legacyModel = s.model || "claude-sonnet-4-6";

      return {
        model: legacyModel,
        systems: s.systems || {
          "claude-sonnet-4-6": s.system || "",
          "claude-opus-4-7": "",
          "claude-opus-4-8": ""
        },
        password: s.password || "",

        messagesByModel: s.messagesByModel || {
          "claude-sonnet-4-6": Array.isArray(s.messages) ? s.messages : [],
          "claude-opus-4-7": [],
          "claude-opus-4-8": []
        },
        startedAtByModel: s.startedAtByModel || {
          "claude-sonnet-4-6": s.startedAt || null,
          "claude-opus-4-7": null,
          "claude-opus-4-8": null
        },
        usageByModel: s.usageByModel || {
          "claude-sonnet-4-6": s.usage || { input: 0, output: 0 },
          "claude-opus-4-7": { input: 0, output: 0 },
          "claude-opus-4-8": { input: 0, output: 0 }
        },

        ghPathsByModel: s.ghPathsByModel || {
          "claude-sonnet-4-6": s.ghPaths || "",
          "claude-opus-4-7": "",
          "claude-opus-4-8": ""
        },
        ghAuto: !!s.ghAuto,
        ghDirByModel: s.ghDirByModel || emptyByModel(() => s.ghDir ?? "ログ"),
        ghContentByModel: s.ghContentByModel || {
          "claude-sonnet-4-6": s.ghContent || "",
          "claude-opus-4-7": "",
          "claude-opus-4-8": ""
        },
        ghFilesByModel: s.ghFilesByModel || {
          "claude-sonnet-4-6": Array.isArray(s.ghFiles) ? s.ghFiles : [],
          "claude-opus-4-7": [],
          "claude-opus-4-8": []
        },
        ghSavedPathByModel: s.ghSavedPathByModel || {
          "claude-sonnet-4-6": s.ghSavedPath || null,
          "claude-opus-4-7": null,
          "claude-opus-4-8": null
        },
        monthly: s.monthly || {}
      };
    } catch {
      return {
        model: "claude-sonnet-4-6",
        systems: emptyByModel(() => ""),
        password: "",
        messagesByModel: emptyByModel(() => []),
        startedAtByModel: emptyByModel(() => null),
        usageByModel: emptyByModel(() => ({ input: 0, output: 0 })),
        ghPathsByModel: emptyByModel(() => ""),
        ghAuto: false,
        ghDirByModel: emptyByModel(() => "ログ"),
        ghContentByModel: emptyByModel(() => ""),
        ghFilesByModel: emptyByModel(() => []),
        ghSavedPathByModel: emptyByModel(() => null),
        monthly: {}
      };
    }
  }

  function persist() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function currentMessages() {
    return state.messagesByModel[state.model] || (state.messagesByModel[state.model] = []);
  }

  function currentUsage() {
    return state.usageByModel[state.model] || (state.usageByModel[state.model] = { input: 0, output: 0 });
  }

  function currentDir() {
    return (state.ghDirByModel[state.model] ?? "").replace(/^\/+|\/+$/g, "");
  }

  function renderSaveStatus() {
    const saved = state.ghSavedPathByModel[state.model];
    const dir = currentDir();
    const repo = REPO_LABEL[state.model] || "";
    $("ghsavestatus").textContent = saved
      ? `この会話の保存先：${repo} / ${saved}（次に押すとここに上書き）`
      : `次に保存すると：${repo} / ${dir ? dir + "/" : ""}（日時）_${modelLabel(state.model)}.md`;
  }

  function syncModelFields() {
    $("system").value = state.systems[state.model] || "";
    $("ghpaths").value = state.ghPathsByModel[state.model] || "";
    $("ghdir").value = state.ghDirByModel[state.model] ?? "";
    render();
    renderGhStatus();
    renderSaveStatus();
  }

  $("model").value = state.model;
  $("password").value = state.password;
  $("ghauto").checked = state.ghAuto;
  syncModelFields();

  $("model").addEventListener("change", (e) => {
    state.model = e.target.value;
    persist();
    syncModelFields();
  });

  $("system").addEventListener("input", (e) => {
    state.systems[state.model] = e.target.value;
    persist();
  });

  $("password").addEventListener("input", (e) => {
    state.password = e.target.value;
    persist();
  });

  $("ghpaths").addEventListener("input", (e) => {
    state.ghPathsByModel[state.model] = e.target.value;
    persist();
  });

  $("ghauto").addEventListener("change", (e) => {
    state.ghAuto = e.target.checked;
    persist();
  });

  $("ghdir").addEventListener("input", (e) => {
    state.ghDirByModel[state.model] = e.target.value.trim();
    persist();
    renderSaveStatus();
  });

  // ---- GitHub ----
  async function ghCall(payload) {
    const r = await fetch("/api/github", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ password: state.password, model: state.model, ...payload }),
    });
    const data = await readJson(r);
    if (!r.ok) throw new Error(data.error || `エラー ${r.status}`);
    return data;
  }

  async function readJson(r) {
    const raw = await r.text();
    try { return JSON.parse(raw); }
    catch {
      return {
        error: `${r.status} が返ってきた（JSON ではない）。/api/ の関数が届いていないか、途中で落ちている`
      };
    }
  }

  function ghStatus(text) {
    $("ghstatus").textContent = text;
  }

  function renderGhStatus() {
    const files = state.ghFilesByModel[state.model] || [];
    if (!files.length) {
      ghStatus("まだ何も読んでいない。");
      return;
    }
    const chars = (state.ghContentByModel[state.model] || "").length.toLocaleString();
    ghStatus(`読み込み済み: ${files.join("、")} (${chars} 文字)`);
  }

  async function loadFromGithub() {
    const paths = (state.ghPathsByModel[state.model] || "")
      .split("\n")
      .map((s) => s.trim())
      .filter(Boolean);

    if (!paths.length) {
      ghStatus("読むファイルのパスが空。上の欄に書いてから。");
      return;
    }
    if (!state.password) {
      ghStatus("パスワードが入っていない。");
      return;
    }

    ghStatus("GitHub から読んでいる……");
    $("ghload").disabled = true;

    try {
      const { files } = await ghCall({ action: "read", paths });
      state.ghFilesByModel[state.model] = files.map((f) => f.path);
      state.ghContentByModel[state.model] = files
        .map((f) => `\n\n===== ${f.path} =====\n\n${f.text ?? f.content ?? ""}`)
        .join("");
      persist();
      renderGhStatus();
    } catch (e) {
      ghStatus("読めなかった：" + e.message);
    } finally {
      $("ghload").disabled = false;
    }
  }

  $("ghload").addEventListener("click", loadFromGithub);

  $("ghclear").addEventListener("click", () => {
    state.ghFilesByModel[state.model] = [];
    state.ghContentByModel[state.model] = "";
    persist();
    renderGhStatus();
  });

  function fullSystem() {
    return (state.systems[state.model] || "") +
      (state.ghContentByModel[state.model] || "");
  }

  function modelLabel(id) {
    const opt = [...$("model").options].find((o) => o.value === id);
    return opt ? opt.textContent : id;
  }

  // *〜* で囲まれた部分をト書き（薄い斜体）にして追加する。中身はそのまま、見え方だけ
  function appendWithStage(parent, text) {
    const re = /\*([^*\n]+?)\*/g;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      const em = document.createElement("em");
      em.className = "stage";
      em.textContent = m[1];
      parent.appendChild(em);
      last = re.lastIndex;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }

  function render() {
    const messages = currentMessages();
    const usage = currentUsage();

    thread.innerHTML = "";
    if (messages.length === 0) {
      thread.innerHTML = '<div class="empty">まだ何も話していない。</div>';
    }

    for (const m of messages) {
      const div = document.createElement("div");
      div.className = "msg " + m.role;

      const who = document.createElement("span");
      who.className = "who";
      who.textContent = m.role === "user"
        ? "ひろみ"
        : modelLabel(m.model || state.model);

      div.appendChild(who);
      appendWithStage(div, m.content);

      if (m.role === "assistant" && m.usage) {
        const c = document.createElement("span");
        c.className = "cost";
        const usd = costUSD(m.model || state.model, m.usage.input, m.usage.output);
        c.textContent = `入力 ${m.usage.input.toLocaleString()} ／ 出力 ${m.usage.output.toLocaleString()} tok ${fmtCost(usd)}`;
        div.appendChild(c);
      }

      thread.appendChild(div);
    }

    const monthly = currentMonthly();
    const convCost = fmtCost(costUSD(state.model, usage.input, usage.output));
    const parts = [];
    if (messages.length) {
      parts.push(`この会話 ${Math.ceil(messages.length / 2)} 往復 ／ 入力 ${usage.input.toLocaleString()}・出力 ${usage.output.toLocaleString()} tok ${convCost}`);
    }
    if (monthly.usd > 0) {
      parts.push(`今月の合計（合奏室経由・全員分） ${fmtCost(monthly.usd)}`);
    }
    meta.textContent = parts.join("　｜　");

    thread.parentElement.scrollTop = thread.parentElement.scrollHeight;
  }

  function showThinking(on) {
    const old = document.getElementById("thinking");
    if (old) old.remove();
    if (!on) return;

    const div = document.createElement("div");
    div.id = "thinking";
    div.className = "msg assistant thinking";
    div.textContent = "……";
    thread.appendChild(div);
    thread.parentElement.scrollTop = thread.parentElement.scrollHeight;
  }

  function showError(text) {
    const div = document.createElement("div");
    div.className = "error";
    div.textContent = text;
    thread.appendChild(div);
    thread.parentElement.scrollTop = thread.parentElement.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    if (!state.password) {
      showError("パスワードが入っていない。上の「設定」を開いて入力してから送って。");
      return;
    }

    const modelAtSend = state.model;
    const messages = state.messagesByModel[modelAtSend] || (state.messagesByModel[modelAtSend] = []);

    if (!state.startedAtByModel[modelAtSend]) {
      state.startedAtByModel[modelAtSend] = new Date().toISOString();
    }

    messages.push({ role: "user", content: text });
    input.value = "";
    persist();
    render(); // 前回のエラー表示もここで消える
    showThinking(true);
    sendBtn.disabled = true;

    try {
      const r = await fetch("/api/claude", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          password: state.password,
          model: modelAtSend,
          system: (state.systems[modelAtSend] || "") + (state.ghContentByModel[modelAtSend] || ""),
          messages: messages.map((m) => ({ role: m.role, content: m.content })),
        }),
      });

      const data = await readJson(r);

      if (!r.ok) {
        if (state.model === modelAtSend) {
          showThinking(false);
          showError(data.error || `エラー ${r.status}`);
        }
      } else {
        const msg = { role: "assistant", content: data.text, model: modelAtSend };

        if (data.usage) {
          const inTok = data.usage.input_tokens || 0;
          const outTok = data.usage.output_tokens || 0;
          msg.usage = { input: inTok, output: outTok };

          const usage = state.usageByModel[modelAtSend] ||
            (state.usageByModel[modelAtSend] = { input: 0, output: 0 });
          usage.input += inTok;
          usage.output += outTok;

          const m = currentMonthly();
          m.input += inTok;
          m.output += outTok;
          m.usd += costUSD(modelAtSend, inTok, outTok) || 0;
        }

        messages.push(msg);

        persist();

        if (state.model === modelAtSend) {
          showThinking(false);
          render();
        }
      }
    } catch (e) {
      if (state.model === modelAtSend) {
        showThinking(false);
        showError("送信に失敗した：" + e.message);
      }
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);

  input.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      send();
    }
  });

  $("reset").addEventListener("click", () => {
    const messages = currentMessages();

    if (messages.length &&
        !confirm("この会話を消して新しく始める？（保存していないログは消える）")) {
      return;
    }

    state.messagesByModel[state.model] = [];
    state.startedAtByModel[state.model] = null;
    state.usageByModel[state.model] = { input: 0, output: 0 };
    state.ghSavedPathByModel[state.model] = null;

    persist();
    render();
    renderSaveStatus();
  });

  function buildMarkdown() {
    const messages = currentMessages();
    const startedAt = state.startedAtByModel[state.model];
    const d = new Date(startedAt || Date.now());
    const pad = (n) => String(n).padStart(2, "0");
    const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
    const label = modelLabel(state.model);

    let md = `# ${label} との会話 ${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}\n\n`;
    md += `- model: ${state.model}\n- 開始: ${d.toLocaleString("ja-JP")}\n\n---\n\n`;

    for (const m of messages) {
      const who = m.role === "user" ? "ひろみ" : modelLabel(m.model || state.model);
      md += `**${who}**\n\n${m.content}\n\n`;
    }

    return { md, filename: `${stamp}_${label.replace(/\s+/g, "")}.md` };
  }

  $("save").addEventListener("click", () => {
    if (!currentMessages().length) return;

    const { md, filename } = buildMarkdown();
    const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $("ghsave").addEventListener("click", async () => {
    if (!currentMessages().length) return;

    if (!state.password) {
      showError("パスワードが入っていない。上の「設定」を開いて入力してから。");
      return;
    }

    const { md, filename } = buildMarkdown();
    const dir = currentDir();
    const freshPath = dir ? `${dir}/${filename}` : filename;
    let savedPath = state.ghSavedPathByModel[state.model];

    // 一度保存したあとにフォルダ欄を変えていたら、どちらに入れるか確認する
    if (savedPath) {
      const savedDir = savedPath.includes("/") ? savedPath.slice(0, savedPath.lastIndexOf("/")) : "";
      if (savedDir !== dir) {
        const moveIt = confirm(
          `この会話は前に「${savedDir || "（ルート）"}」に保存してある。\n` +
          `今の設定は「${dir || "（ルート）"}」。\n\n` +
          `OK＝新しい場所に保存する（古い場所のファイルは残るので、あとで手で消す）\n` +
          `キャンセル＝前と同じ場所に上書きする`
        );
        if (moveIt) savedPath = null;
      }
    }

    const path = savedPath || freshPath;
    const btn = $("ghsave");

    btn.disabled = true;
    btn.textContent = "保存中……";

    try {
      const { url } = await ghCall({
        action: "write",
        path,
        content: md,
        message: `合奏室: ${filename}`
      });

      state.ghSavedPathByModel[state.model] = path;
      persist();
      renderSaveStatus();
      btn.textContent = "保存した";
      meta.textContent = `GitHub に保存：${REPO_LABEL[state.model] || ""} / ${path}`;
      if (url) console.log(url);
    } catch (e) {
      showError("GitHub に保存できなかった：" + e.message);
      btn.textContent = "GitHub に保存";
    } finally {
      btn.disabled = false;
      setTimeout(() => { btn.textContent = "GitHub に保存"; }, 2000);
    }
  });

  render();
  renderGhStatus();

  if (state.ghAuto &&
      (state.ghPathsByModel[state.model] || "").trim() &&
      state.password) {
    loadFromGithub();
  }
</script>
</body>
</html>
